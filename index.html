<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<style>
:root{--bg:#050b14;--panel:rgba(10,22,36,.72);--text:#dff6ff;--muted:#7fa3b8;--accent:#4cc9f0;--line:#1d3a52;--danger:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#bg{position:fixed;inset:0;z-index:0;touch-action:none}
header,#stage,#log,footer{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2em}
header button{background:rgba(10,22,36,.6);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:15px}
#stage{flex:1;min-height:120px}
#log{max-height:30vh;overflow-y:auto;padding:8px 18px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 14px;border-radius:14px;white-space:pre-wrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.me{align-self:flex-end;background:rgba(34,70,100,.7);border:1px solid var(--line)}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.sys{align-self:center;color:var(--muted);font-size:15px;text-align:center}
footer{padding:10px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
#status{color:var(--muted);min-height:22px;font-size:15px;text-align:center}
#mic{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:var(--accent);color:#06222e;font-size:34px;box-shadow:0 0 28px rgba(76,201,240,.55);transition:transform .15s,background .3s}
#mic.listening{background:var(--danger);box-shadow:0 0 34px rgba(255,107,107,.7);animation:pulse 1.2s infinite}
#mic.thinking{background:#f4c95d;box-shadow:0 0 34px rgba(244,201,93,.6)}
#mic.speaking{background:#7bd88f;box-shadow:0 0 34px rgba(123,216,143,.6)}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){#mic.listening{animation:none}}
label.opt{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.typed{display:flex;gap:8px;width:100%;max-width:560px}
.typed input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px}
.typed button{padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:#06222e;font-size:16px}
#settings{display:none;position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:20px}
#settings.open{display:flex}
.card{background:#0e1c2c;border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.card h2{margin:0 0 12px;font-size:18px}
.card input,.card select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;margin:4px 0 12px}
.card textarea{width:100%;height:100px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;margin:4px 0 12px}
.card .row{display:flex;gap:10px;justify-content:flex-end}
.card button{padding:10px 16px;border-radius:10px;border:0;font-size:16px;background:var(--accent);color:#06222e}
.card button.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
small{color:var(--muted)}
#start{padding:18px 34px;border-radius:40px;border:2px solid rgba(255,255,255,.35);background:var(--accent);color:#06222e;font-size:20px;font-weight:600;box-shadow:0 0 28px rgba(76,201,240,.55)}
#pill{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:rgba(10,22,36,.6);color:var(--accent);font-size:15px}
#pill.off{color:var(--muted)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header>
  <h1>JARVIS</h1>
  <button id="openSettings">Einstellungen</button>
</header>
<div id="stage"></div>
<div id="log"></div>
<footer>
  <div id="status">Tippe auf „Jarvis aktivieren“.</div>
  <button id="start">Jarvis aktivieren</button>
  <button id="pill" hidden>● Hört zu</button>
  <div class="typed"><input id="typed" type="text" placeholder="Oder hier tippen …" enterkeyhint="send"><button id="send">Senden</button></div>
</footer>

<div id="settings">
  <div class="card">
    <h2>Einstellungen</h2>
    <label>Gemini-API-Schlüssel<br><small>Wird nur auf diesem Gerät gespeichert.</small></label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <label>Dein Name</label>
    <input id="name" type="text" placeholder="z. B. Alex">
    <label>Stimme<br><small>Männliche deutsche Stimme wählen. Bessere Stimmen: iPad-Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Deutsch.</small></label>
    <select id="voice"></select>
    <div class="row" style="justify-content:flex-start;margin:-4px 0 12px"><button class="ghost" id="testVoice" type="button">Stimme testen</button></div>
    <label>Tiefe der Stimme<br><small>Nach links wird die Stimme tiefer und männlicher.</small></label>
    <input id="pitch" type="range" min="0.4" max="1.2" step="0.05">
    <label>Verbindung zu Mail und Stundenplan<br><small>Link deines Apps-Script (siehe Anleitung).</small></label>
    <input id="hub" type="url" autocomplete="off" autocapitalize="off" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Geheimwort der Verbindung</label>
    <input id="token" type="password" autocomplete="off" placeholder="dein Geheimwort">
    <div class="row" style="justify-content:flex-start;margin:-4px 0 12px"><button class="ghost" id="testHub" type="button">Verbindung testen</button></div>
    <div id="hubStatus" style="color:var(--muted);font-size:14px;margin-bottom:12px"></div>
    <label>Groq-Schlüssel (schnell, kostenlos)<br><small>Optional. Mit Schlüssel nimmt Jarvis zuerst Groq und bei Problemen Gemini.</small></label>
    <input id="groq" type="password" autocomplete="off" placeholder="gsk_...">
    <label>Groq-Modell</label>
    <input id="groqModel" type="text" autocomplete="off" autocapitalize="off" placeholder="llama-3.1-8b-instant">
    <label>KI-Modell (Gemini)<br><small>Wenn Jarvis zu lange braucht, ein anderes Modell probieren.</small></label>
    <input id="model" type="text" autocomplete="off" autocapitalize="off" placeholder="gemini-3.8-flash">
    <div class="row" style="justify-content:flex-start;margin:-4px 0 12px"><button class="ghost" id="listModels" type="button">Verfügbare Modelle zeigen</button></div>
    <div id="modelList" style="color:var(--muted);font-size:14px;margin-bottom:12px;word-break:break-all"></div>
    <label>Zusatzwissen (Stundenplan, Mails usw.)<br><small>Alles, was Jarvis wissen soll.</small></label>
    <textarea id="wissen" placeholder="z. B. Morgen fällt die 3. Stunde Mathe aus."></textarea>
    <div class="row">
      <button class="ghost" id="reset">Gespräch löschen</button>
      <button id="save">Speichern</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_MODEL = 'gemini-3.8-flash';
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || '' }catch(e){ return '' } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
function model(){ return store.get('jv_model') || DEFAULT_MODEL; }
function groqModel(){ return store.get('jv_groqmodel') || 'llama-3.1-8b-instant'; }
let LASTUSED = '';
function activeModel(){ return (LASTUSED === 'groq' || (!LASTUSED && store.get('jv_groq'))) ? groqModel() : model(); }
let history = [], recognition = null, busy = false, STATE = '';

function add(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  if(cls === 'ai'){ d.style.cursor = 'pointer'; d.title = 'Tippen zum Vorlesen'; d.onclick = async () => { stopListening(); await speak(text); resume(); }; }
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
}
function setState(cls, text){ STATE = cls; $('status').textContent = text; }

/* ---------- Stimme ---------- */
function deVoices(){
  const q = v => /premium|enhanced|erweitert|verbessert/i.test(v.name) ? 0 : 1;
  return (window.speechSynthesis ? speechSynthesis.getVoices() : [])
    .filter(v => v.lang && v.lang.toLowerCase().startsWith('de')).sort((a,b) => q(a)-q(b));
}
function pickVoice(){
  const vs = deVoices(), want = store.get('jv_voice');
  let v = vs.find(x => x.name === want);
  if(!v){ for(const n of ['Martin','Markus','Yannick','Viktor','Stefan','Jonas','Hans','Reed','Eddy','Rocko']){ v = vs.find(x => x.name.includes(n)); if(v) break; } }
  if(!v){ v = vs.find(x => !/anna|helena|petra|marlene|vicki|katja|sabine|linda|ute|hedda|sandy|shelley|flo|grandma|female|weiblich/i.test(x.name)); }
  return v || vs[0];
}
function fillVoices(){
  const sel = $('voice'), cur = store.get('jv_voice');
  sel.innerHTML = '<option value="">Automatisch (männlich bevorzugt)</option>';
  deVoices().forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name; if(v.name === cur) o.selected = true; sel.appendChild(o); });
}
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged = fillVoices; }
function unlockSpeech(){
  const syn = window.speechSynthesis;
  if(!syn || syn.speaking || syn.pending) return;
  try{
    const u = new SpeechSynthesisUtterance('Ok');
    u.volume = 0; u.lang = 'de-DE';
    syn.speak(u);
    syn.getVoices();
  }catch(e){}
}
addEventListener('pointerdown', unlockSpeech);
addEventListener('touchend', unlockSpeech);
function speakChunk(text, voice){
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.pitch = parseFloat(store.get('jv_pitch') || '0.7'); u.rate = 0.95; u.volume = 1;
    if(voice) u.voice = voice;
    let started = false, done = false;
    const fin = ok => { if(!done){ done = true; clearTimeout(wd); resolve(ok); } };
    const wd = setTimeout(() => { if(!started) fin(false); }, 5000);
    u.onstart = () => { started = true; };
    u.onend = () => fin(true);
    u.onerror = () => fin(started);
    speechSynthesis.speak(u);
  });
}
async function speak(text, voiceName){
  const synth = window.speechSynthesis;
  if(!synth){ add('Dieser Browser kann nicht sprechen.', 'sys'); return; }
  synth.cancel();
  await new Promise(r => setTimeout(r, 700));
  try{ synth.resume(); }catch(e){}
  let v = pickVoice();
  if(voiceName){ v = deVoices().find(x => x.name === voiceName) || v; }
  const parts = (text.match(/[^.!?]+[.!?]*\s*/g) || [text]).map(x => x.trim()).filter(Boolean);
  let first = true;
  for(const part of parts){
    let ok = await speakChunk(part, v);
    if(!ok && first){ synth.cancel(); await new Promise(r => setTimeout(r, 800)); ok = await speakChunk(part, v); }
    if(!ok && first){
      if(v){ const ok2 = await speakChunk(part, null); if(ok2){ first = false; continue; } }
      add('Kein Ton. Prüfe: Lautstärke hoch, iPad nicht stumm (Kontrollzentrum), Bluetooth aus. Tippe auf eine Antwort, um sie noch einmal vorzulesen.', 'sys');
      return;
    }
    first = false;
  }
}

/* ---------- Einstellungen ---------- */
$('key').value = store.get('jv_key');
$('name').value = store.get('jv_name');
$('wissen').value = store.get('jv_wissen');
$('model').value = store.get('jv_model');
$('groq').value = store.get('jv_groq');
$('groqModel').value = store.get('jv_groqmodel');
$('hub').value = store.get('jv_hub');
$('token').value = store.get('jv_token');
$('pitch').value = store.get('jv_pitch') || '0.7';
fillVoices();
$('openSettings').onclick = () => { fillVoices(); $('settings').classList.add('open'); };
$('pitch').oninput = () => store.set('jv_pitch', $('pitch').value);
$('testVoice').onclick = () => speak('Guten Tag. Alle Systeme laufen einwandfrei.', $('voice').value);
$('save').onclick = () => {
  store.set('jv_key', $('key').value.trim());
  store.set('jv_name', $('name').value.trim());
  store.set('jv_wissen', $('wissen').value);
  store.set('jv_model', $('model').value.trim());
  store.set('jv_groq', $('groq').value.trim());
  store.set('jv_groqmodel', $('groqModel').value.trim());
  store.set('jv_voice', $('voice').value);
  store.set('jv_hub', $('hub').value.trim());
  store.set('jv_token', $('token').value.trim());
  store.set('jv_pitch', $('pitch').value);
  loadHub(false);
  $('settings').classList.remove('open');
};
$('listModels').onclick = async () => {
  const out = $('modelList');
  const key = $('key').value.trim() || store.get('jv_key');
  if(!key){ out.textContent = 'Trage zuerst den Schlüssel ein.'; return; }
  out.textContent = 'Lade …';
  try{
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100', {headers:{'x-goog-api-key':key}});
    const d = await r.json();
    if(!r.ok) throw new Error((d.error && d.error.message) || r.status);
    const names = (d.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m => m.name.replace('models/','')).filter(n => /flash|lite/.test(n) && !/image|tts|live|audio|embed/.test(n));
    out.textContent = names.length ? 'Zum Probieren: ' + names.join(', ') : 'Keine Modelle gefunden.';
  }catch(e){ out.textContent = 'Fehler: ' + e.message; }
};
$('reset').onclick = () => { history = []; $('log').innerHTML = ''; $('settings').classList.remove('open'); };
if(!store.get('jv_key') && !store.get('jv_groq')){ add('Willkommen! Öffne zuerst die Einstellungen und trage deinen Gemini-Schlüssel ein.', 'sys'); }

/* ---------- Verbindung: Mails (und später Stundenplan) ---------- */
let hub = null, hubAt = 0, hubFirst = true, hubTimer = null;
const seenMails = new Set();
const mailKey = m => m.von + '|' + m.betreff + '|' + m.datum;
const mailName = m => (m.von || '').replace(/<.*>/, '').replace(/"/g, '').trim() || m.von;
async function loadHub(announce){
  const url = store.get('jv_hub'), tok = store.get('jv_token');
  if(!url) return 'Kein Link eingetragen.';
  try{
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(tok));
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    hub = d; hubAt = Date.now();
    const fresh = [];
    (d.mails || []).forEach(m => {
      const k = mailKey(m);
      if(!m.gelesen && !seenMails.has(k)) fresh.push(m);
      seenMails.add(k);
    });
    if(announce && !hubFirst && fresh.length && !busy) announceMail(fresh[0], fresh.length);
    hubFirst = false;
    return 'Verbindung ok:' + (d.stundenplan ? ' Stundenplan geladen.' : '') + (d.mails ? ' ' + d.mails.length + ' Mails geladen.' : '');
  }catch(e){ return 'Fehler: ' + e.message; }
}
async function announceMail(m, n){
  const txt = 'Neue Mail von ' + mailName(m) + ': ' + m.betreff + (n > 1 ? '. Dazu noch ' + (n-1) + ' weitere.' : '.');
  busy = true; stopListening();
  add(txt, 'ai');
  await speak(txt);
  busy = false; resume();
}
function hubText(){
  if(!hub) return '';
  let t = '';
  if(hub.mails && hub.mails.length){
    t += 'E-Mails der letzten Tage (neueste zuerst):\n' + hub.mails.map(m =>
      '- ' + (m.gelesen ? '' : '[UNGELESEN] ') + 'Von ' + mailName(m) + ', Betreff: ' + m.betreff + '. Vorschau: ' + (m.text || '')).join('\n') + '\n' +
      'Lies Mails nie komplett vor, fasse sie kurz zusammen.\n';
  }
  if(hub.stundenplan){ t += 'Stundenplan:\n' + hub.stundenplan + '\n'; }
  return t;
}
$('testHub').onclick = async () => {
  store.set('jv_hub', $('hub').value.trim()); store.set('jv_token', $('token').value.trim());
  $('hubStatus').textContent = 'Teste …';
  $('hubStatus').textContent = await loadHub(false);
};
loadHub(false);
hubTimer = setInterval(() => { if(store.get('jv_hub')) loadHub(true); }, 180000);

/* ---------- Gemini ---------- */
function systemText(){
  const name = store.get('jv_name') || 'dem Nutzer';
  const wissen = store.get('jv_wissen');
  return 'Du bist Jarvis, ein persönlicher KI-Assistent und sprichst mit ' + name + '. ' +
    'Dein Ton: höflich, ruhig, souverän, mit trockenem Humor, wie ein britischer Butler. ' +
    'Antworte auf Deutsch und kurz (meist 1 bis 3 Sätze), weil deine Antwort vorgelesen wird. ' +
    'Keine Listen, kein Markdown, keine Sternchen, keine Emojis. ' +
    'Heute ist ' + new Date().toLocaleString('de-DE', {dateStyle:'full', timeStyle:'short'}) + '. ' +
    (hubText() ? 'Echte aktuelle Daten:\n' + hubText() : '') + (wissen ? 'Weiteres Wissen über den Nutzer:\n' + wissen : '') + (!hubText() && !wissen ? 'Du hast noch keinen Zugriff auf Mails oder Stundenplan. Sag das ehrlich, wenn danach gefragt wird.' : '');
}
async function callGemini(key){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 40000);
  let res;
  try{
    res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model() + ':generateContent', {
      method:'POST', signal: ctl.signal,
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body: JSON.stringify({ systemInstruction:{parts:[{text:systemText()}]}, contents: history.slice(-20) })
    });
  }catch(e){ throw new Error(e.name === 'AbortError' ? 'Gemini antwortet nicht (40 Sekunden). Versuch es nochmal oder wähle ein schnelleres Modell.' : e.message); }
  finally{ clearTimeout(timer); }
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'Fehler ' + res.status);
  return (data.candidates && data.candidates[0] && data.candidates[0].content.parts.map(p=>p.text||'').join('')) || 'Dazu fällt mir gerade nichts ein.';
}
async function callGroq(key){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 15000);
  const msgs = [{role:'system', content: systemText()}].concat(history.slice(-20).map(h => ({role: h.role === 'model' ? 'assistant' : 'user', content: h.parts[0].text})));
  let res;
  try{
    res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST', signal: ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + key},
      body: JSON.stringify({ model: groqModel(), messages: msgs, max_tokens: 400, temperature: 0.7 })
    });
  }catch(e){ throw new Error(e.name === 'AbortError' ? 'Groq antwortet nicht.' : 'Groq nicht erreichbar: ' + e.message); }
  finally{ clearTimeout(timer); }
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'Groq-Fehler ' + res.status);
  return (data.choices && data.choices[0] && data.choices[0].message.content) || 'Dazu fällt mir gerade nichts ein.';
}
async function healGroq(key){
  try{
    const r = await fetch('https://api.groq.com/openai/v1/models', {headers:{Authorization:'Bearer ' + key}});
    const d = await r.json(); if(!r.ok) return null;
    const ids = (d.data || []).map(m => m.id).filter(id => !/whisper|guard|tts|prompt|playai|embed|orpheus|safeguard/i.test(id));
    let pick = null;
    for(const re of [/8b-instant/, /gpt-oss-20b/, /llama-3\.3-70b/, /gpt-oss-120b/, /llama/, /qwen/]){ pick = ids.find(id => re.test(id)); if(pick) break; }
    pick = pick || ids[0];
    if(!pick || pick === groqModel()) return null;
    store.set('jv_groqmodel', pick); $('groqModel').value = pick;
    add('Groq-Modell automatisch auf „' + pick + '“ gestellt.', 'sys');
    return pick;
  }catch(e){ return null; }
}
async function healGemini(key){
  try{
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100', {headers:{'x-goog-api-key':key}});
    const d = await r.json(); if(!r.ok) return null;
    const names = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', ''));
    const stable = names.map(n => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)-flash$/); return m ? [parseFloat(m[1]), n] : null; }).filter(Boolean).sort((a, b) => b[0] - a[0]);
    const pick = stable.length ? stable[0][1] : names.find(n => /flash/.test(n) && !/image|tts|live|audio|embed/.test(n));
    if(!pick || pick === model()) return null;
    store.set('jv_model', pick); $('model').value = pick;
    add('Gemini-Modell automatisch auf „' + pick + '“ gestellt.', 'sys');
    return pick;
  }catch(e){ return null; }
}
async function withHeal(call, heal, key){
  try{ return await call(key); }
  catch(e){
    if(/does not exist|not found|no longer available|not supported|no access|decommission/i.test(e.message)){
      const m = await heal(key);
      if(m) return await call(key);
    }
    throw e;
  }
}
async function askGemini(text){
  const gk = store.get('jv_key'), qk = store.get('jv_groq');
  if(!gk && !qk) throw new Error('Kein API-Schlüssel eingetragen.');
  if(store.get('jv_hub') && Date.now() - hubAt > 120000){ await Promise.race([loadHub(false), new Promise(r => setTimeout(r, 8000))]); }
  history.push({role:'user', parts:[{text}]});
  let out, err1 = null;
  if(qk){
    try{ out = await withHeal(callGroq, healGroq, qk); LASTUSED = 'groq'; }
    catch(e){ err1 = e; }
  }
  if(out === undefined && gk){
    try{ out = await withHeal(callGemini, healGemini, gk); LASTUSED = 'gemini'; }
    catch(e){ history.pop(); throw new Error(err1 ? err1.message + ' / ' + e.message : e.message); }
  }
  if(out === undefined){ history.pop(); throw err1 || new Error('Keine Antwort.'); }
  history.push({role:'model', parts:[{text:out}]});
  return out;
}
async function handle(text){
  busy = true;
  stopListening();
  add(text, 'me');
  setState('thinking', 'Jarvis denkt nach …');
  try{
    const answer = await askGemini(text);
    add(answer, 'ai');
    setState('speaking', 'Jarvis spricht … (tippe aufs Mikrofon zum Unterbrechen)');
    await speak(answer);
  }catch(e){ add('Fehler: ' + e.message, 'sys'); }
  busy = false;
  if(active){
    awakeUntil = Date.now() + 12000;
    setState('listening', 'Ich höre zu … (du kannst direkt antworten)');
    resume();
    setTimeout(() => { if(Date.now() >= awakeUntil && !busy) idleStatus(); }, 12200);
  } else idleStatus();
}
let active = false, awakeUntil = 0, rec = null, restartT = null, wakeLock = null;
const WAKE = /(jarvis|jarwis|yarvis|charvis|tscharvis|dscharvis|jarves|jarvie|jarvi[sz])/i;
function idleStatus(){ setState('', active ? 'Sag „Jarvis“, um mit mir zu sprechen.' : 'Tippe auf „Jarvis aktivieren“.'); }
function stopListening(){
  clearTimeout(restartT);
  if(rec){ rec.onend = null; rec.onresult = null; rec.onerror = null; try{ rec.abort(); }catch(e){} rec = null; }
}
function resume(){
  if(!active || busy || document.hidden) return;
  clearTimeout(restartT);
  restartT = setTimeout(startRec, 400);
}
function processFinal(t){
  const m = t.match(WAKE);
  let cmd = '';
  if(m){
    const before = t.slice(0, m.index).replace(/^(hey|hallo|hi|okay|ok|he)\b[\s,]*/i, '').trim();
    const after = t.slice(m.index + m[0].length).replace(/^[\s,.:;!?-]+/, '').trim();
    cmd = after || before;
    if(!cmd){
      awakeUntil = Date.now() + 8000;
      setState('listening', 'Ja? Ich höre zu …');
      setTimeout(() => { if(Date.now() >= awakeUntil && !busy) idleStatus(); }, 8200);
      return;
    }
  } else if(Date.now() < awakeUntil){ cmd = t; }
  if(cmd){ awakeUntil = 0; handle(cmd); }
}
function startRec(){
  if(!active || busy || rec) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ add('Dieser Browser kann keine Spracherkennung. Bitte Safari nutzen.', 'sys'); active = false; return; }
  rec = new SR();
  rec.lang = 'de-DE'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i], t = r[0].transcript.trim();
      if(!t) continue;
      if(!r.isFinal){
        if(Date.now() < awakeUntil || WAKE.test(t)) setState('listening', '„' + t + '“');
      } else processFinal(t);
    }
  };
  rec.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      add('Mikrofon oder Diktierfunktion nicht erlaubt. Erlaube Safari das Mikrofon und schalte unter Einstellungen → Allgemein → Tastatur die Diktierfunktion ein.', 'sys');
      pause();
    }
  };
  rec.onend = () => { rec = null; if(active && !busy) resume(); };
  try{ rec.start(); }catch(e){ rec = null; resume(); }
}
async function keepAwake(){ try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function activate(){
  active = true; unlockSpeech(); keepAwake();
  $('start').hidden = true; $('pill').hidden = false; $('pill').className = ''; $('pill').textContent = '● Hört zu';
  idleStatus(); startRec();
}
function pause(){
  active = false; stopListening();
  $('pill').className = 'off'; $('pill').textContent = '○ Pausiert (tippen zum Starten)';
  idleStatus();
}
$('start').onclick = activate;
$('pill').onclick = () => { if(active) pause(); else activate(); };
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ stopListening(); }
  else if(active){ keepAwake(); resume(); }
});
function sendTyped(){
  const v = $('typed').value.trim();
  if(!v || busy) return;
  $('typed').value = '';
  if(window.speechSynthesis){ window.speechSynthesis.cancel(); }
  handle(v);
}
$('send').onclick = sendTyped;
$('typed').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); sendTyped(); } });

/* ---------- Hintergrund: HUD-Animation ---------- */
const cv = $('bg'), g = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, t = 0, px = 0, py = 0, tx = 0, ty = 0, energy = .25, hue = [76,201,240];
const COL = {'':[76,201,240], listening:[255,107,107], thinking:[244,201,93], speaking:[123,216,143]};
const NRG = {'':.25, listening:.65, thinking:.5, speaking:1};
const ripples = [];
const pts = Array.from({length:60}, () => ({x:Math.random(), y:Math.random(), vx:(Math.random()-.5)*.00025, vy:(Math.random()-.5)*.00025}));
function resize(){
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d; cv.style.width = W+'px'; cv.style.height = H+'px';
  g.setTransform(d,0,0,d,0,0);
}
addEventListener('resize', resize); resize();
function move(e){ const p = e.touches ? e.touches[0] : e; tx = (p.clientX/W - .5); ty = (p.clientY/H - .5); }
addEventListener('pointermove', move);
addEventListener('pointerdown', e => { move(e); ripples.push({x:e.clientX, y:e.clientY, r:0}); });
const rgba = (c,a) => 'rgba(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ',' + a + ')';
function frame(){
  t += reduce ? .002 : .016;
  const tc = COL[STATE] || COL[''];
  for(let i=0;i<3;i++) hue[i] += (tc[i]-hue[i])*.06;
  energy += ((NRG[STATE] ?? .25) - energy)*.05;
  px += (tx-px)*.06; py += (ty-py)*.06;
  const c = hue, sp = reduce ? .1 : 1;
  g.clearRect(0,0,W,H);
  const cx = W/2 + px*30, cy = H*.36 + py*30, R = Math.min(W*.42, H*.3);
  const bgG = g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.7);
  bgG.addColorStop(0, rgba(c,.12+energy*.08)); bgG.addColorStop(1, 'rgba(5,11,20,0)');
  g.fillStyle = bgG; g.fillRect(0,0,W,H);
  // Raster
  g.fillStyle = rgba(c,.12);
  for(let x=(px*-20)%48; x<W; x+=48) for(let y=(py*-20)%48; y<H; y+=48) g.fillRect(x,y,1.5,1.5);
  // Partikel
  g.lineWidth = 1;
  pts.forEach(p => {
    p.x += p.vx*sp*16; p.y += p.vy*sp*16;
    if(p.x<0||p.x>1) p.vx *= -1; if(p.y<0||p.y>1) p.vy *= -1;
    const X = p.x*W + px*40, Y = p.y*H + py*40;
    g.fillStyle = rgba(c,.5); g.beginPath(); g.arc(X,Y,1.6,0,6.283); g.fill();
    pts.forEach(q => { const dx = X-(q.x*W+px*40), dy = Y-(q.y*H+py*40), d = dx*dx+dy*dy;
      if(d<9000 && q!==p){ g.strokeStyle = rgba(c,.12*(1-d/9000)); g.beginPath(); g.moveTo(X,Y); g.lineTo(q.x*W+px*40,q.y*H+py*40); g.stroke(); } });
  });
  // Ringe
  const spin = (STATE === 'thinking' ? 3 : 1) * sp;
  const rings = [[.55,6,.35,1,2],[.7,10,.5,-1,1.5],[.85,3,.25,1,2.5],[1,40,.9,-1,1]];
  rings.forEach(([k,n,fill,dir,w],i) => {
    g.strokeStyle = rgba(c,.35+energy*.35); g.lineWidth = w;
    const seg = 6.283/n;
    for(let j=0;j<n;j++){
      const a0 = j*seg + t*dir*spin*(.35+i*.18);
      g.beginPath(); g.arc(cx,cy,R*k,a0,a0+seg*fill); g.stroke();
    }
  });
  // Skala
  g.strokeStyle = rgba(c,.5); g.lineWidth = 1;
  for(let i=0;i<72;i++){
    const a = i/72*6.283 - t*.08*sp, l = i%6 ? 5 : 12;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*R*1.12, cy+Math.sin(a)*R*1.12); g.lineTo(cx+Math.cos(a)*(R*1.12+l), cy+Math.sin(a)*(R*1.12+l)); g.stroke();
  }
  // Wellenring
  g.strokeStyle = rgba(c,.8); g.lineWidth = 2;
  for(let i=0;i<96;i++){
    const a = i/96*6.283, w = (Math.sin(a*5+t*4*sp)+Math.sin(a*9-t*3*sp))*.5;
    const l = 4 + energy*18*(.4+Math.abs(w));
    g.beginPath(); g.moveTo(cx+Math.cos(a)*R*.42, cy+Math.sin(a)*R*.42); g.lineTo(cx+Math.cos(a)*(R*.42+l), cy+Math.sin(a)*(R*.42+l)); g.stroke();
  }
  // Kern
  const cr = R*.26*(1+.07*Math.sin(t*(2+energy*4))*energy*1.5);
  const core = g.createRadialGradient(cx,cy,0,cx,cy,cr*2.4);
  core.addColorStop(0,'rgba(255,255,255,.95)'); core.addColorStop(.25, rgba(c,.9)); core.addColorStop(1, rgba(c,0));
  g.fillStyle = core; g.beginPath(); g.arc(cx,cy,cr*2.4,0,6.283); g.fill();
  g.strokeStyle = rgba(c,.95); g.lineWidth = 2;
  g.beginPath();
  for(let i=0;i<3;i++){ const a = i*2.094 + t*.5*sp - 1.57; g.lineTo(cx+Math.cos(a)*cr*1.1, cy+Math.sin(a)*cr*1.1); }
  g.closePath(); g.stroke();
  g.beginPath(); g.arc(cx,cy,cr*1.25,0,6.283); g.stroke();
  // Tipp-Wellen
  for(let i=ripples.length-1;i>=0;i--){
    const r = ripples[i]; r.r += 5; 
    if(r.r > 260){ ripples.splice(i,1); continue; }
    g.strokeStyle = rgba(c,.6*(1-r.r/260)); g.lineWidth = 2; g.beginPath(); g.arc(r.x,r.y,r.r,0,6.283); g.stroke();
  }
  // Anzeigen
  g.fillStyle = rgba(c,.75); g.font = '12px ui-monospace, Menlo, monospace';
  const now = new Date();
  g.textAlign = 'left'; g.fillText(now.toLocaleTimeString('de-DE'), 18, 84);
  g.fillText('SYSTEM ONLINE', 18, 100);
  g.textAlign = 'right';
  const lbl = {'':'BEREIT', listening:'HÖRT ZU', thinking:'ANALYSE', speaking:'ANTWORTET'}[STATE] || 'BEREIT';
  g.fillText(lbl, W-18, 84);
  g.fillText(activeModel().toUpperCase(), W-18, 100);
  requestAnimationFrame(frame);
}
frame();
</script>
